# Legacy image datasets (inactive public registry)
# Not loaded by default. gasbench only reads real_*.yaml + synthetic_*.yaml.
# Pass this file to load_benchmark_datasets_from_yaml(yaml_path=...) to include them.
# Culled 2026-08-20: duplicate shards / combinatorial MAVOS grid / saturated copies.

datasets:
  - name: v14-vil100-jpeg
    path: 34data/v14-vil100-jpeg
    modality: image
    media_type: real
    source_format: parquet
    media_per_archive: -1
    archives_per_dataset: -1
    generator_family: real
    content_category: aerial

  - name: fakeclue-real-satellite
    path: bitmind/FakeClue
    modality: image
    media_type: real
    source_format: zip
    media_per_archive: 500
    archives_per_dataset: 2
    include_paths: [data/real/satellite/]
    generator_family: real
    content_category: diverse

  - name: fakeclue-real-doc
    path: bitmind/FakeClue
    modality: image
    media_type: real
    source_format: zip
    media_per_archive: 500
    archives_per_dataset: 2
    include_paths: [data/real/doc/]
    generator_family: real
    content_category: documents

  - name: SDv15R-dpmsolver-25-15K-part1
    path: 34data/SDv15R-dpmsolver-25-15K-part1
    modality: image
    media_type: synthetic
    source_format: png
    media_per_archive: -1
    archives_per_dataset: -1
    notes: Released from v14 bmcore holdouts
    generator_family: sd
    generator_variant: sd15
    content_category: art

  - name: SDv15R-dpmsolver-25-15K-part3
