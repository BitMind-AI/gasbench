# Image Dataset Configurations -- Synthetic + Semisynthetic Images
# 3-class image taxonomy: real | synthetic | semisynthetic. No rendered class.
# media_type: synthetic = fully neural-generated (t2i/GAN).
# media_type: semisynthetic = neural edit derived materially from captured media.
#   Edits of exclusively synthetic/rendered inputs remain synthetic; do not infer
#   provenance from an operation name such as i2i or inpaint alone.
#
# Excluded (cannot assign a correct 3-class label; no reliable split):
#   justweirdimages — mixed real photos, 2D animation, photoshops; no sidecar
#     or path/column that isolates a single class.
#   cg-fake-id — CGI identity-document stills (filenames *cg*.jpg). Images have
#     no rendered class; the dump is uniformly CGI so it cannot be split.
#   deepfake-insight — parquet filenames are IMDB-WIKI celebrity IDs with no
#     real/fake marker. Cannot verify every row is manipulated vs real photo.

# Some previously-active entries were moved to legacy_images.yaml (not loaded by default).

datasets:

  - name: cosyn-400k
    path: allenai/CoSyn-400K
    modality: image
    media_type: synthetic
    source_format: parquet
    media_per_archive: 1000
    archives_per_dataset: 1
    generator_family: mixed-generation
    content_category: diverse

