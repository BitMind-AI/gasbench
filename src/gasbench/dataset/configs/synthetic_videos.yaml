# Video Dataset Configurations -- Synthetic, Rendered, Semisynthetic Videos
# 4-class video taxonomy: real | synthetic | rendered | semisynthetic.
# media_type: synthetic = fully neural-generated (t2v/i2v).
# media_type: rendered = classical CGI / game engine / sim (not neural gen).
# media_type: semisynthetic = materially captured visual content retained alongside
#   spatially localized generated/replaced content. Fully synthesized output remains
#   synthetic; modifying exclusively synthetic/rendered media does not change that.
#
# Excluded (cannot assign a correct 4-class label; no reliable split):
#   artifact-bench — 34data dump is 1,350 rows = full Artifact-Bench mix
#     (Task_1 250 real + 250 fake, Task_2 500 fake, Task_3 350 fake). HF copy
#     is parquet-converted; include_paths cannot isolate real_*.mp4 vs fake.

# Some previously-active entries were moved to legacy_videos.yaml (not loaded by default).

datasets:

